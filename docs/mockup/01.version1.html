                                <button @click="showLangMenu = !showLangMenu" class="text-sm font-bold border border-white/20 px-3 py-1 rounded-full hover:bg-white/10 transition">
                                    {{ currentLang.code.toUpperCase() }}
                                </button>
                                <div v-if="showLangMenu" class="absolute top-full right-0 mt-2 w-40 bg-stone-900 border border-white/10 rounded-xl shadow-xl overflow-hidden z-50">
                                    <button v-for="l in store.languages" :key="l.code" @click="changeLang(l.code)"
                                        class="w-full text-left px-4 py-3 text-sm hover:bg-white/10 flex items-center gap-3 transition">
                                        <span>{{ l.label }}</span>
                                        <i v-if="store.lang === l.code" data-lucide="check" class="w-3 h-3 ml-auto text-vn-gold"></i>
                                    </button>
                                </div>
                            </div>
                            <button @click="$router.push('/tim-kiem')" class="p-2 hover:bg-white/10 rounded-full transition"><i data-lucide="search" class="w-5 h-5"></i></button>
                        </div>
                    </nav>

                    <!-- Mobile Header -->
                    <div class="md:hidden fixed top-0 w-full z-40 bg-stone-950/90 backdrop-blur border-b border-white/5 p-4 flex justify-between items-center">
                        <div class="text-xl font-serif font-bold tracking-widest" @click="$router.push('/')">VN.</div>
                        <div class="flex items-center gap-3">
                            <!-- Mobile Language Dropdown -->
                            <div class="relative">
                                <button @click="showMobileLangMenu = !showMobileLangMenu" class="text-xs font-bold border border-white/20 px-2 py-1 rounded-full">
                                    {{ currentLang.code.toUpperCase() }}
                                </button>
                                <div v-if="showMobileLangMenu" class="absolute top-full right-0 mt-2 w-32 bg-stone-900 border border-white/10 rounded-xl shadow-xl overflow-hidden z-50">
                                    <button v-for="l in store.languages" :key="l.code" @click="changeLang(l.code)"
                                        class="w-full text-left px-4 py-3 text-xs hover:bg-white/10 flex items-center gap-2 transition">
                                        <span>{{ l.label }}</span>
                                    </button>
                                </div>
                            </div>
                            <button @click="$router.push('/tim-kiem')"><i data-lucide="search" class="w-5 h-5"></i></button>
                        </div>
                    </div>

                    <div class="flex-grow">
                        <router-view v-slot="{ Component }">
                            <transition name="fade" mode="out-in">
                                <component :is="Component" />
                            </transition>
                        </router-view>
                    </div>

                    <footer class="bg-stone-900 border-t border-white/10 py-12 mt-auto hidden md:block">
                        <div class="container mx-auto px-4 flex justify-between items-center">
                            <div><h4 class="text-2xl font-serif font-bold mb-2">VNCANVAS</h4><p class="text-gray-500 text-sm">{{ t('footer_desc') }}</p></div>
                            <div class="flex gap-6 text-sm text-gray-400">
                                <router-link to="/ve-chung-toi" class="hover:text-white transition">{{ t('about') }}</router-link>
                                <router-link to="/lien-he" class="hover:text-white transition">{{ t('contact') }}</router-link>
                                <router-link to="/chinh-sach" class="hover:text-white transition">{{ t('policy') }}</router-link>
                            </div>
                        </div>
                    </footer>

                    <nav class="md:hidden fixed bottom-4 left-4 right-4 z-50 glass-panel rounded-2xl h-16 flex justify-around items-center px-2 shadow-2xl">
                        <router-link to="/" class="flex flex-col items-center p-2 text-gray-400 aria-[current=page]:text-white transition"><i data-lucide="home" class="w-5 h-5 mb-1"></i><span class="text-[10px] uppercase">Home</span></router-link>
                        <router-link to="/tim-kiem" class="flex flex-col items-center p-2 text-gray-400 aria-[current=page]:text-white transition"><i data-lucide="search" class="w-5 h-5 mb-1"></i><span class="text-[10px] uppercase">Tìm</span></router-link>
                         <button class="flex flex-col items-center p-2 text-gray-400 transition" @click="showMenu = true"><i data-lucide="menu" class="w-5 h-5 mb-1"></i><span class="text-[10px] uppercase">Menu</span></button>
                    </nav>

                    <div v-if="showMenu" class="fixed inset-0 z-[60] bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center space-y-8 animate-fade-in-up">
                        <button @click="showMenu = false" class="absolute top-6 right-6 p-2"><i data-lucide="x" class="w-8 h-8"></i></button>
                        <router-link @click="showMenu = false" to="/mien/north" class="text-3xl font-serif hover:text-vn-gold">{{ t('north') }}</router-link>
                        <router-link @click="showMenu = false" to="/mien/central" class="text-3xl font-serif hover:text-vn-gold">{{ t('central') }}</router-link>
                        <router-link @click="showMenu = false" to="/mien/south" class="text-3xl font-serif hover:text-vn-gold">{{ t('south') }}</router-link>
                        <div class="border-t border-white/10 w-24 my-4"></div>
                        <router-link @click="showMenu = false" to="/ve-chung-toi" class="text-xl text-gray-400 hover:text-white">{{ t('about') }}</router-link>
                        <router-link @click="showMenu = false" to="/chinh-sach" class="text-xl text-gray-400 hover:text-white">{{ t('policy') }}</router-link>
                    </div>
                </div>
            `,
        setup() {
          const isScrolled = ref(false);
          const showMenu = ref(false);
          const showLangMenu = ref(false);
          const showMobileLangMenu = ref(false);
          const currentLang = computed(() =>
            store.languages.find((l) => l.code === store.lang)
          );

          const changeLang = (code) => {
            store.setLang(code);
            showLangMenu.value = false;
            showMobileLangMenu.value = false;
          };

          const handleScroll = () => {
            isScrolled.value = window.scrollY > 50;
          };

          onMounted(() => {
            window.addEventListener("scroll", handleScroll);
            refreshIcons();
          });
          watch([showMenu, showLangMenu, showMobileLangMenu], () =>
            refreshIcons()
          );

          return {
            isScrolled,
            showMenu,
            showLangMenu,
            showMobileLangMenu,
            store,
            currentLang,
            changeLang,
            t: translateText,
          };
        },
      };

      const router = createRouter({
        history: createWebHashHistory(),
        routes: [
          { path: "/", component: HomeView },
          { path: "/tim-kiem", component: SearchView },
          { path: "/dia-diem/:slug", component: DetailView },
          { path: "/mien/:slug", component: RegionView },
          { path: "/ve-chung-toi", component: AboutView },
          { path: "/lien-he", component: ContactView },
          { path: "/chinh-sach", component: PolicyView },
        ],
        scrollBehavior(to, from, savedPosition) {
          return { top: 0, behavior: "smooth" };
        },
      });

      const app = createApp(App);
      app.use(router);
      app.mount("#app");
    </script>
  </body>
</html>
